[package]
name = "rosace-compositor"
description = "wgpu GPU compositor for ROSACE — uploads CPU pixel buffer as texture, blits via fullscreen quad shader"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wgpu     = "24"
pollster = "0.3"
log      = "0.4"

# Web-native surface: build the wgpu surface straight from the <canvas>
# (rosace-platform drops winit on web and drives frames itself).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
