[package]
description = "SQLite-backed persistent storage for ROSACE"
name = "rosace-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
rosace-core  = { path = "../rosace-core", version = "0.1.0" }
rosace-trace = { path = "../rosace-trace", version = "0.1.0" }

# D114/Phase 31 Step 1: real on-disk persistence. `bundled` compiles
# SQLite from source so every platform ships the same version (no system
# libsqlite drift; iOS/Android link it the same way). Target-gated —
# rusqlite links C and doesn't build on wasm32; the web story for the
# `permanent` tier (localStorage/IndexedDB) is a named deferral, see
# src/lib.rs's module doc.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

# Native file/save picker dialogs (merged from the former `rosace-file`
# crate, D131) — real AppKit/Win32/GTK UI on desktop; iOS/Android/wasm32
# are named gaps, see src/file/picker.rs's module doc.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
rfd = "0.17"
