name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Install clipboard deps (real system clipboard tests, D-clipboard-ci)
      # rosace-clipboard's Linux SystemClipboard shells out to xclip/xsel
      # against a real X selection — neither is present on a bare
      # ubuntu-latest runner, so clipboard round-trip tests silently no-op
      # (write fails, read returns None) rather than actually failing loud.
      # xvfb-run below gives them a real (virtual) X display to round-trip
      # through, matching what a desktop CI/dev machine actually has.
      run: sudo apt-get update && sudo apt-get install -y xvfb xclip
    - name: Build
      run: cargo build --workspace --verbose
    - name: Run tests
      # Runs PARALLEL (the default) as of 2026-08-13. It was pinned to
      # --test-threads=1 to work around tests racing on shared global state.
      # That workaround was hiding a real framework bug: the dirty set was
      # process-global while the state store beside it was thread-local, so
      # two live engines dropped each other's rebuilds — and dropped the
      # user's keystrokes with them. Serial execution made the symptom
      # invisible.
      #
      # The races are fixed at the source now (thread-local dirty set; the
      # theme-provider and frame-scheduler tests serialized on their own
      # locks), verified over 12 consecutive clean workspace runs. Running
      # parallel is what makes a REGRESSION of that class fail here instead
      # of shipping.
      run: xvfb-run -a cargo test --workspace --verbose

  clippy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
