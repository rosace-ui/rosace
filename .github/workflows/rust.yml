name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Install clipboard deps (real system clipboard tests, D-clipboard-ci)
      # rosace-clipboard's Linux SystemClipboard shells out to xclip/xsel
      # against a real X selection — neither is present on a bare
      # ubuntu-latest runner, so clipboard round-trip tests silently no-op
      # (write fails, read returns None) rather than actually failing loud.
      # xvfb-run below gives them a real (virtual) X display to round-trip
      # through, matching what a desktop CI/dev machine actually has.
      run: sudo apt-get update && sudo apt-get install -y xvfb xclip
    - name: Build
      run: cargo build --workspace --verbose
    - name: Run tests
      # --test-threads=1: several tests assert on shared global/engine state
      # (timers, media query, clipboard) that races under parallel execution
      # — passes clean single-threaded, confirmed 2026-08-04. Real bugs,
      # not this test-isolation gap, still fail single-threaded the same way.
      run: xvfb-run -a cargo test --workspace --verbose -- --test-threads=1

  clippy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
