[package]
description = "HTTP client hooks for ROSACE: use_query, use_network_status"
name = "rosace-net"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
rosace-core  = { path = "../rosace-core", version = "0.1.0" }
rosace-state = { path = "../rosace-state", version = "0.1.0" }
rosace-trace = { path = "../rosace-trace", version = "0.1.0" }

# D113/Phase 30: real HTTP with rustls TLS. Target-gated — ureq is
# std::net-based and rustls/ring don't build on wasm32; the client's wasm
# stub returns a documented Err instead (see src/client.rs's module doc).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "2"
# RFC 6455 WebSockets (merged from the former `rosace-ws` crate, D131) —
# same target gating and same reason: std::net-based, wasm gets the
# documented named-gap error instead (see src/ws/client.rs).
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
