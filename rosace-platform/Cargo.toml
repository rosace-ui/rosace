[package]
description = "Windowing and platform event integration for ROSACE (desktop via winit)"
name = "rosace-platform"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
web-time           = "1"
rosace-animate    = { path = "../rosace-animate", version = "0.1.0" }
rosace-compositor = { path = "../rosace-compositor", version = "0.1.0" }
rosace-core       = { path = "../rosace-core", version = "0.1.0" }
rosace-ime        = { path = "../rosace-ime", version = "0.1.0" }
rosace-render     = { path = "../rosace-render", version = "0.1.0" }
rosace-shader     = { path = "../rosace-shader", version = "0.1.0" }
rosace-state      = { path = "../rosace-state", version = "0.1.0" }
rosace-theme      = { path = "../rosace-theme", version = "0.1.0" }
rosace-trace      = { path = "../rosace-trace", version = "0.1.0" }
log                = "0.4"
winit              = "0.30"
softbuffer         = "0.4"

# Android (D106 Phase 24 Step 3): winit hard-errors on target_os = "android"
# unless one of its android-activity backend features is picked, even though
# rosace-ffi's JNI-driven Android path never runs winit's own event loop —
# winit is still a transitive dependency for the types rosace-ffi/
# rosace-platform share, so it must compile cleanly for the target
# regardless. "native-activity" (not "game-activity") — lighter weight, no
# Google Play Games SDK pulled in, and nothing here needs GameActivity's
# extra surface (it's for games wanting deeper Play Games integration).
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# Drives the async wgpu init on web: `spawn_local` the presenter build so the
# browser event loop can poll it, instead of blocking the main thread.
wasm-bindgen-futures = "0.4"
# Bridges the `log` facade to the browser console (nothing inits a logger
# otherwise, so every log::info!/error! is a silent no-op on web).
console_log = { version = "1", features = ["color"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
# D107 Phase 25 Step 4 — runtime shadow-DOM sync (post-hydration state
# changes the Step 3 build-time export couldn't know about). Layer 5 (this
# crate) -> Layer 2 (rosace-core, rosace-web-seo's only dependency) —
# no cycle. wasm32-gated for the same reason as everything else in this
# block: never compiled for iOS/Android/macOS/Windows/Linux.
rosace-web-seo = { path = "../rosace-web-seo", version = "0.1.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Window", "Document", "Element", "HtmlElement", "Node",
    "HtmlCanvasElement", "CanvasRenderingContext2d", "CssStyleDeclaration",
    "ImageData", "Performance",
    # D127 "environment" track — live OS light/dark + reduce-motion via
    # matchMedia (see run_web_native's media-query listener block).
    "MediaQueryList",
    "MouseEvent", "KeyboardEvent", "Event", "EventTarget",
    # winit's web backend delivers only CursorMoved — no clicks/touch/wheel/keys
    # — so we attach our own listeners (see wire_web_input) and need these.
    "PointerEvent", "WheelEvent",
    # D107 Phase 25 Step 4 — reuses the Declarative Shadow DOM root Step 3's
    # build-time export already attached to #rsc-seo (falls back to
    # attach_shadow if none exists, e.g. `rsc dev` without a build step).
    "ShadowRoot", "ShadowRootInit", "ShadowRootMode",
]
