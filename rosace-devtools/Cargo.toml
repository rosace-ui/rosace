[package]
description = "In-app DevTools overlay for ROSACE"
name = "rosace-devtools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
rosace-core    = { path = "../rosace-core", version = "0.1.0" }
rosace-state   = { path = "../rosace-state", version = "0.1.0" }
rosace-trace   = { path = "../rosace-trace", version = "0.1.0" }
rosace-widgets = { path = "../rosace-widgets", version = "0.1.0" }
rosace-render  = { path = "../rosace-render", version = "0.1.0" }

# Wire format for the external DevTools client (D138). Confined to THIS
# crate on purpose: `rosace-trace` is depended on by everything and carries
# almost no dependencies, and serialisation is a consumer concern — the
# framework emits typed events, it does not choose anyone's format.
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# For constructing `RosaceTrace::Log { timestamp }` in trace_panel tests.
web-time = "1"
