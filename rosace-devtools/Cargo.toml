[package]
description = "In-app DevTools overlay for ROSACE"
name = "rosace-devtools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rosace-core    = { path = "../rosace-core", version = "0.1.0" }
rosace-state   = { path = "../rosace-state", version = "0.1.0" }
rosace-trace   = { path = "../rosace-trace", version = "0.1.0" }
rosace-widgets = { path = "../rosace-widgets", version = "0.1.0" }
rosace-render  = { path = "../rosace-render", version = "0.1.0" }

[dev-dependencies]
# For constructing `RosaceTrace::Log { timestamp }` in trace_panel tests.
web-time = "1"
